[package]
name = "dragon"
version = "0.1.0"
edition = "2024"

[dependencies]
spin = "0.9"
bitflags = "2.6"
thiserror = {version = "2.0.18", default-features = false}

[features]
default = ["aarch64"]
aarch64 = []

[lints.rust]
missing_docs = "deny" # Warns on missing documentation for PUBLIC items

[lints.clippy]
missing_docs_in_private_items = "deny" # Warns on missing documentation for PRIVATE items
